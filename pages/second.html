<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For a special someone</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <style>
      :root {
        --primary-100: #ffe4ec;
        --primary-200: #ffcce0;
        --primary-300: #ffb3d1;
        --primary-400: #ff99c2;
        --primary-500: #ff80b4;
        --primary-600: #ff66a3;
        --primary-700: #ff4d94;
        --primary-800: #e6397f;
        --primary-900: #cc296b;
        --secondary-100: #e6faf5;
        --secondary-200: #ccf5eb;
        --secondary-300: #b3efe0;
        --secondary-400: #99e9d6;
        --secondary-500: #80e3cc;
        --secondary-600: #66d9bf;
        --secondary-700: #4dcfb2;
        --secondary-800: #33c4a6;
        --secondary-900: #1ab897;
      }

      * {
        font-family: "Chewy";
      }

      .bg-content {
        background: rgba(255, 240, 245, 0.9);
        backdrop-filter: blur(15px);
        border: 2px solid #ffcce0;
        border-radius: 30px !important;
        box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3) !important;
      }

      .vid {
        filter: brightness(0.6);
      }

      .btn-exp {
        font-family: "Poppins", sans-serif !important;
        font-weight: 600;
        font-size: 15px;
        background: linear-gradient(135deg, #ffffff, #ffe4ec);
        color: var(--primary-600);
        border: 2px solid var(--primary-300);
        box-shadow: 0 6px 15px rgba(255, 105, 180, 0.25);
        transition: all 0.3s ease;
      }
      .btn-exp:hover,
      .btn-exp:active {
        background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(255, 105, 180, 0.4);
      }

      #rdm {
        font-family: "Poppins", sans-serif !important;
        font-weight: 600;
        font-size: 15px;
        background: #ffffff;
        color: #ff66a3;
        border: 2px solid #ffcce0;
        box-shadow: 0 6px 15px rgba(255, 105, 180, 0.25);
        transition: all 0.1s ease;
      }

      @media screen and (min-width: 768px) {
        .content-hero {
          width: 50% !important;
        }

        h1 {
          font-size: 60px !important;
          font-weight: 700 !important;
          line-height: 1.2 !important;
        }

        h2 {
          font-size: 48px !important; /* 60 ÷ 1.25 */
          font-weight: 600 !important;
          line-height: 1.3 !important;
        }

        h3 {
          font-size: 38px !important; /* 48 ÷ 1.25 */
          font-weight: 600 !important;
          line-height: 1.3 !important;
        }

        h4 {
          font-size: 30px !important; /* 38 ÷ 1.25 */
          font-weight: 500 !important;
          line-height: 1.4 !important;
        }

        h5 {
          font-size: 24px !important; /* 30 ÷ 1.25 */
          font-weight: 500 !important;
          line-height: 1.4 !important;
        }

        h6 {
          font-size: 20px !important; /* 24 ÷ 1.2 */
          font-weight: 500 !important;
          line-height: 1.5 !important;
        }
      }
    </style>
    <div class="w-100 overflow-hidden position-relative" style="height: 100vh">
      <!-- VIDEO -->
      <div
        class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden"
      >
        <video
          class="vid w-100 h-100"
          style="object-fit: cover; object-position: center;"
          src="../assets/background-loop.mp4"
          autoplay
          loop
          muted
          playsinline
        ></video>
      </div>

      <!-- Content -->
      <div class="position-absolute w-100 h-100 top-0 start-0 d-flex justify-content-center align-items-center p-3">
        <div class="bg-content w-100 rounded-4 shadow-lg p-4 p-md-5 d-flex flex-column justify-content-center align-items-center text-center" style="max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <div class="gif">
                <img class="rounded-2 overflow-hidden" src="../assets/first-meet.png" autoplay loop muted width="200px">
            </div>
            <div class="mt-3 mb-2">
                <h3 class="" style="color:var(--primary-500); letter-spacing:6px; text-shadow: 2px 2px 0px rgba(255,125,180,0.5)">Hi Myla, How are u?</h3>
            </div>
            <div class="mt-5 d-flex gap-3 w-100 justify-content-center">
                <a
                class="btn-exp text-decoration-none px-4 py-3 rounded-2"
                href="aldiamy.html"
                >I hate u, Aldi</a
                >
                <a
                id="rdm"
                class="btn-exp text-decoration-none px-4 py-3 rounded-2"
                >I'm fine</a
                >
            </div>
        </div>
      </div>

    <!-- BOOTSTRAP -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- INLINE JS -->
    <script>
        const btn = document.getElementById("rdm");

        function moveButton() {
            if (btn.style.position !== "fixed") {
                btn.style.position = "fixed";
                btn.style.zIndex = "100";
            }

            const btnWidth = btn.offsetWidth || 120;
            const btnHeight = btn.offsetHeight || 50;

            // Pastikan tidak keluar dari batas layar dengan margin aman 20px
            const padding = 20;
            const maxX = Math.max(0, window.innerWidth - btnWidth - padding);
            const maxY = Math.max(0, window.innerHeight - btnHeight - padding);

            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;
        }

        btn.addEventListener("mouseenter", moveButton);
        btn.addEventListener("click", moveButton);
        btn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            moveButton();
        });
    </script>
  </body>
</html>
