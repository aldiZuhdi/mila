    <style>
      :root {
        --primary-100: #ffe4ec;
        --primary-200: #ffcce0;
        --primary-300: #ffb3d1;
        --primary-400: #ff99c2;
        --primary-500: #ff80b4;
        --primary-600: #ff66a3;
        --primary-700: #ff4d94;
        --primary-800: #e6397f;
        --primary-900: #cc296b;
      }

      body {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .title-font {
        font-family: 'Chewy', cursive;
      }

      /* Masonry / Pinterest Style Grid */
      .grid-sizer,
      .bento-item {
        width: 100%;
        margin-bottom: 16px;
      }

      @media (min-width: 576px) {
        .grid-sizer,
        .bento-item {
          width: calc(50% - 8px);
        }
      }

      @media (min-width: 992px) {
        .grid-sizer,
        .bento-item {
          width: calc(33.333% - 10.666px);
        }
      }

      @media (min-width: 1200px) {
        .grid-sizer,
        .bento-item {
          width: calc(25% - 12px);
        }
      }

      .bento-card {
        background: rgba(30, 30, 30, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }

      .bento-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(255, 128, 180, 0.25);
        border-color: var(--primary-500);
      }

      .bento-card img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 16px 16px 0 0;
      }

      .bento-card video {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 16px 16px 0 0;
      }

      .bento-body {
        padding: 12px 16px;
      }

      .badge-tag {
        background: rgba(255, 128, 180, 0.15);
        color: var(--primary-400);
        border: 1px solid var(--primary-600);
        font-size: 0.75rem;
      }

      .nav-btn {
        background: rgba(255, 128, 180, 0.15);
        border: 1px solid var(--primary-400);
        color: #fff;
        transition: all 0.2s ease;
      }
      .nav-btn:hover {
        background: var(--primary-500);
        border-color: var(--primary-500);
        color: #fff;
      }

      /* Back to top button */
      #btnTop {
        position: fixed;
        bottom: 25px;
        right: 25px;
        z-index: 99;
        background: var(--primary-600);
        color: white;
        border: none;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
    </style>

      // Shuffle array (Acak urutan seperti Pinterest)
      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      // Render Bento Cards into Masonry grid
      function renderBentoCards() {
        const grid = document.getElementById("bentoGrid");
        const shuffledAssets = shuffleArray([...assetList]);

        shuffledAssets.forEach((asset, idx) => {
          const item = document.createElement("div");
          item.className = "bento-item";

          let mediaHTML = "";
          if (asset.type === "image") {
            mediaHTML = `<img src="${asset.src}" alt="${asset.name}" loading="lazy" />`;
          } else {
            // Video autoplay muted dengan controls bawaan browser untuk unmute
            mediaHTML = `
              <video src="${asset.src}" autoplay loop muted controls preload="metadata" playsinline></video>
            `;
          }

          item.innerHTML = `
            <div class="bento-card">
              ${mediaHTML}
              <div class="bento-body d-flex align-items-center justify-content-between">
                <span class="badge badge-tag rounded-pill px-3 py-1">
                  ${asset.type === "image" ? '<i class="fa-regular fa-image me-1"></i> Image' : '<i class="fa-solid fa-video me-1"></i> Video'}
                </span>
                <span class="small text-secondary" style="font-size: 0.75rem;">#Memory ${idx + 1}</span>
              </div>
            </div>
          `;

          grid.appendChild(item);
        });

        // Initialize Masonry setalah imagesLoaded
        imagesLoaded(grid, function () {
          new Masonry(grid, {
            itemSelector: ".bento-item",
            columnWidth: ".grid-sizer",
            percentPosition: true,
            gutter: 16
          });
        });
      }

      // Scroll to Top Button
      const btnTop = document.getElementById("btnTop");
      window.onscroll = function() {
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
          btnTop.style.display = "flex";
        } else {
          btnTop.style.display = "none";
        }
      };
      btnTop.onclick = function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // Run on Load
      document.addEventListener("DOMContentLoaded", renderBentoCards);
    </script>
  </body>
</html>
