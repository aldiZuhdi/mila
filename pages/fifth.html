<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For a special someone</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body style="max-height: 100dvh; overflow-y: hidden;">
    <style>
      :root {
        --primary-100: #ffe4ec;
        --primary-200: #ffcce0;
        --primary-300: #ffb3d1;
        --primary-400: #ff99c2;
        --primary-500: #ff80b4;
        --primary-600: #ff66a3;
        --primary-700: #ff4d94;
        --primary-800: #e6397f;
        --primary-900: #cc296b;
      }

      * {
        font-family: "Poppins", sans-serif;
      }

      .title-font {
        font-family: "Chewy", cursive;
      }

      .bg-content {
        background: rgba(18, 18, 18, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        color: #fff;
      }

      .vid {
        filter: brightness(0.4);
      }

      /* Track List */
      .track-list {
        max-height: 240px;
        overflow-y: auto;
      }

      .track-list::-webkit-scrollbar {
        width: 6px;
      }

      .track-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }

      .track-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 10px 14px;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .track-item:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .track-item.active {
        background: rgba(255, 128, 180, 0.18);
        border-color: var(--primary-500);
      }

      .track-item.active .track-title {
        color: var(--primary-500) !important;
        font-weight: 600;
      }

      /* Controls & Custom Inputs */
      .control-btn {
        background: none;
        border: none;
        color: #b3b3b3;
        font-size: 20px;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .control-btn:hover {
        color: var(--primary-300);
        transform: scale(1.1);
      }

      .play-btn {
        width: 48px;
        height: 48px;
        background: #fff;
        color: var(--primary-800);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 4px 15px rgba(255, 128, 180, 0.3);
        transition: all 0.2s ease;
      }

      .play-btn:hover {
        background: var(--primary-500);
        color: #fff;
        transform: scale(1.08);
      }

      input[type="range"] {
        accent-color: var(--primary-500);
        height: 4px;
        border-radius: 2px;
        cursor: pointer;
      }

      .nav-btn {
        background: rgba(255, 128, 180, 0.15);
        border: 1px solid var(--primary-400);
        color: #fff;
        transition: all 0.2s ease;
      }
      .nav-btn:hover {
        background: var(--primary-500);
        border-color: var(--primary-500);
        color: #fff;
      }

      .primary-color {
        color: var(--primary-500) !important;
      }
    </style>

    <div class="w-100 overflow-hidden position-relative" style="height: 100vh">
      <!-- VIDEO BACKGROUND -->
      <div class="w-100 h-100 overflow-hidden d-flex justify-content-center align-items-center">
        <video class="vid" src="../assets/background-loop.mp4" style="width: 100dvw; height: 100dvh; object-fit: cover;" autoplay loop muted></video>
      </div>

      <!-- PLAYER CONTENT -->
      <div class="position-absolute w-100 h-100 top-0 start-0 d-flex justify-content-center align-items-center px-3 py-4">
        <div class="bg-content w-100 rounded-4 shadow-lg p-4 d-flex flex-column justify-content-between" style="max-width: 550px; max-height: 90vh;">
          
          <!-- Header -->
          <div class="d-flex align-items-center justify-content-between mb-3 border-bottom border-secondary pb-2">
            <div class="d-flex align-items-center gap-2">
              <span class="title-font fs-3 text-light">My fav playlist about u</span>
            </div>
            <span class="badge border border-secondary text-secondary">4 Songs</span>
          </div>

          <!-- Current Playing Info -->
          <div class="text-center my-2 p-3 rounded-3" style="background: rgba(255,255,255,0.03);">
            <div id="currentTitle" class="fs-5 fw-bold text-truncate primary-color">Pilih Lagu</div>
            <div id="currentArtist" class="text-secondary small mt-1">Playlist</div>
          </div>

          <!-- Track List -->
          <div class="track-list my-2 d-flex flex-column gap-2 pe-1" id="playlist">
            <!-- Playlist Items rendered via JS -->
          </div>

          <!-- Player Controls Section -->
          <div class="mt-3 pt-2 border-top border-secondary">
            
            <!-- Timeline & Time -->
            <div class="d-flex align-items-center gap-2 mb-2">
              <span id="currentTime" class="small text-secondary" style="min-width: 35px;">0:00</span>
              <input type="range" id="progress" class="form-range flex-grow-1" value="0" step="0.1" min="0" max="100">
              <span id="durationTime" class="small text-secondary" style="min-width: 35px;">0:00</span>
            </div>

            <!-- Controls & Volume -->
            <div class="d-flex align-items-center justify-content-between mt-3">
              <!-- Volume Control -->
              <div class="d-flex align-items-center gap-2" style="width: 120px;">
                <i id="volumeIcon" class="fa-solid fa-volume-high primary-color small"></i>
                <input type="range" id="volume" class="form-range" value="100" min="0" max="100">
              </div>

              <!-- Main Control Buttons -->
              <div class="d-flex align-items-center gap-3">
                <button id="prevTrack" class="control-btn" title="Lagu Sebelumnya">
                  <i class="fa-solid fa-backward-step"></i>
                </button>
                <button id="playBtn" class="play-btn" title="Play / Pause">
                  <i id="playIcon" class="fa-solid fa-play"></i>
                </button>
                <button id="nextTrack" class="control-btn" title="Lagu Selanjutnya">
                  <i class="fa-solid fa-forward-step"></i>
                </button>
              </div>

              <!-- Extra space/balance -->
              <div style="width: 120px;" class="text-end">
                <i class="fa-solid fa-music primary-color small"></i>
              </div>
            </div>

          </div>

          <!-- Navigation Buttons -->
          <div class="d-flex justify-content-between mt-4">
            <a class="btn nav-btn px-4 py-2 rounded-3 text-decoration-none" href="fourth.html">Prev</a>
            <a class="btn nav-btn px-4 py-2 rounded-3 text-decoration-none" href="sixth.html">Next</a>
          </div>

        </div>
      </div>
    </div>

    <audio id="audio"></audio>

    <!-- BOOTSTRAP JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcXn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- PLAYER SCRIPT -->
    <script>
      const songs = [
        {
          title: "Thank You For Everything",
          artist: "Diego Gonzalez",
          src: "../sounds/thank-u-for-everything.mp3"
        },
        {
          title: "Terbuang Dalam Waktu",
          artist: "Barasuara",
          src: "../sounds/Barasuara - Terbuang Dalam Waktu (Official Video) - Barasuara.mp3"
        },
        {
          title: "Titik Nadir",
          artist: "Kahitna Feat. Monita Tahalea",
          src: "../sounds/Kahitna Feat. Monita Tahalea - Titik Nadir (Official Music Video) - Musica Studios.mp3"
        },
        {
          title: "Kota Ini Tak Sama Tanpamu",
          artist: "Nadhif Basalamah",
          src: "../sounds/Nadhif Basalamah - kota ini tak sama tanpamu (Official Lyric Video) - nadhif basalamah.mp3"
        }
      ];

      let currentIndex = 0;
      const audio = document.getElementById("audio");
      const playBtn = document.getElementById("playBtn");
      const playIcon = document.getElementById("playIcon");
      const prevBtn = document.getElementById("prevTrack");
      const nextBtn = document.getElementById("nextTrack");
      const progress = document.getElementById("progress");
      const volume = document.getElementById("volume");
      const volumeIcon = document.getElementById("volumeIcon");
      const currentTimeEl = document.getElementById("currentTime");
      const durationTimeEl = document.getElementById("durationTime");
      const currentTitle = document.getElementById("currentTitle");
      const currentArtist = document.getElementById("currentArtist");
      const playlistEl = document.getElementById("playlist");

      // Render Track List
      function renderPlaylist() {
        playlistEl.innerHTML = "";
        songs.forEach((song, index) => {
          const item = document.createElement("div");
          item.className = `track-item d-flex align-items-center justify-content-between ${index === currentIndex ? 'active' : ''}`;
          item.onclick = () => loadAndPlayTrack(index);

          item.innerHTML = `
            <div class="d-flex align-items-center gap-3 overflow-hidden">
              <span class="text-secondary small fw-bold" style="min-width: 15px;">${index + 1}</span>
              <div class="text-truncate">
                <div class="track-title text-light small">${song.title}</div>
                <div class="text-secondary" style="font-size: 0.75rem;">${song.artist}</div>
              </div>
            </div>
            <i class="fa-solid ${index === currentIndex && !audio.paused ? 'fa-chart-simple primary-color' : 'fa-play text-secondary'} small"></i>
          `;
          playlistEl.appendChild(item);
        });
      }

      // Load Track
      function loadTrack(index) {
        currentIndex = index;
        const song = songs[currentIndex];
        audio.src = song.src;
        currentTitle.textContent = song.title;
        currentArtist.textContent = song.artist;
        renderPlaylist();
      }

      // Load and Play Track
      function loadAndPlayTrack(index) {
        loadTrack(index);
        playAudio();
      }

      function playAudio() {
        audio.play().then(() => {
          playIcon.className = "fa-solid fa-pause";
          renderPlaylist();
        }).catch(err => console.log(err));
      }

      function pauseAudio() {
        audio.pause();
        playIcon.className = "fa-solid fa-play";
        renderPlaylist();
      }

      // Play / Pause Toggle
      playBtn.addEventListener("click", () => {
        if (audio.paused) {
          if (!audio.src) {
            loadTrack(currentIndex);
          }
          playAudio();
        } else {
          pauseAudio();
        }
      });

      // Next / Prev Toggle
      nextBtn.addEventListener("click", () => {
        let nextIndex = (currentIndex + 1) % songs.length;
        loadAndPlayTrack(nextIndex);
      });

      prevBtn.addEventListener("click", () => {
        let prevIndex = (currentIndex - 1 + songs.length) % songs.length;
        loadAndPlayTrack(prevIndex);
      });

      // Track Ended Auto Next
      audio.addEventListener("ended", () => {
        let nextIndex = (currentIndex + 1) % songs.length;
        loadAndPlayTrack(nextIndex);
      });

      // Format Time helper
      function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      // Update Timeline Progress
      audio.addEventListener("timeupdate", () => {
        if (audio.duration) {
          progress.value = (audio.currentTime / audio.duration) * 100;
          currentTimeEl.textContent = formatTime(audio.currentTime);
          durationTimeEl.textContent = formatTime(audio.duration);
        }
      });

      // Seek Audio
      progress.addEventListener("input", () => {
        if (audio.duration) {
          audio.currentTime = (progress.value / 100) * audio.duration;
        }
      });

      // Volume Control
      volume.addEventListener("input", () => {
        const volVal = volume.value / 100;
        audio.volume = volVal;
        if (volVal === 0) {
          volumeIcon.className = "fa-solid fa-volume-xmark text-secondary small";
        } else if (volVal < 0.5) {
          volumeIcon.className = "fa-solid fa-volume-low primary-color small";
        } else {
          volumeIcon.className = "fa-solid fa-volume-high primary-color small";
        }
      });

      // Initial Load
      loadTrack(0);
    </script>
  </body>
</html>
