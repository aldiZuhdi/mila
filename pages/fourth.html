    <!-- INLINE JS -->
    <script>
        // Tanggal Chatting (Fixed: 24 Agt 2025 s/d 30 Jun 2026)
        const chatStart = new Date("2025-08-24T00:00:00");
        const chatEnd = new Date("2026-06-30T00:00:00");

        function calculateChattingStats() {
            const diffMs = chatEnd - chatStart;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHours = Math.floor(diffMin / 60);
            const diffDays = Math.floor(diffHours / 24);
            const diffWeeks = Math.floor(diffDays / 7);
            
            // Hitung perkiraan bulan
            let months = (chatEnd.getFullYear() - chatStart.getFullYear()) * 12 + (chatEnd.getMonth() - chatStart.getMonth());
            if (chatEnd.getDate() < chatStart.getDate()) {
                months--;
            }

            document.getElementById("chat-months").innerText = months;
            document.getElementById("chat-weeks").innerText = diffWeeks;
            document.getElementById("chat-days").innerText = diffDays;
            document.getElementById("chat-minutes").innerText = diffMin.toLocaleString('id-ID');
            document.getElementById("chat-seconds").innerText = diffSec.toLocaleString('id-ID');
        }

        // Tanggal Mulai Asing (30 Juni 2026 s/d Realtime/Sekarang)
        const strangerStart = new Date("2026-06-30T00:00:00");

        function updateStrangerTimer() {
            const now = new Date();
            let diffSec = Math.floor((now - strangerStart) / 1000);

            if (diffSec < 0) diffSec = 0; // Jika sebelum 30 Juni 2026

            const days = Math.floor(diffSec / (3600 * 24));
            diffSec %= (3600 * 24);

            const hours = Math.floor(diffSec / 3600);
            diffSec %= 3600;

            const minutes = Math.floor(diffSec / 60);
            const seconds = diffSec % 60;

            document.getElementById("stranger-days").innerText = String(days).padStart(2, '0');
            document.getElementById("stranger-hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("stranger-minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("stranger-seconds").innerText = String(seconds).padStart(2, '0');
        }

        calculateChattingStats();
        setInterval(updateStrangerTimer, 1000);
        updateStrangerTimer();
    </script>
