<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For a special someone</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body style="overflow-x: hidden;">
    <style>
      :root {
        --primary-100: #fff0f5;
        --primary-200: #ffe4ec;
        --primary-300: #ffcce0;
        --primary-400: #ff99c2;
        --primary-500: #ff69b4;
        --primary-600: #ff409f;
        --primary-700: #e62e8b;
        --primary-800: #cc1b78;
      }

      * {
        font-family: "Poppins", sans-serif;
      }

      .font-chewy {
        font-family: "Chewy", cursive !important;
      }

      .vid {
        object-fit: cover;
        object-position: center;
        filter: brightness(0.6) contrast(1.05);
      }

      /* Cute Hero Container */
      .hero-card {
        background: rgba(255, 240, 245, 0.22);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 28px;
        box-shadow: 0 12px 35px rgba(255, 105, 180, 0.25);
        padding: 32px;
        max-width: 620px;
        width: 100%;
        transition: all 0.3s ease;
      }

      .hero-name {
        color: #ff69b4;
        font-size: 3rem;
        line-height: 1.1;
        text-shadow: 2px 2px 10px rgba(255, 105, 180, 0.4);
      }

      .hero-fullname {
        color: #ffffff;
        font-size: 1.6rem;
        letter-spacing: 1.5px;
        text-shadow: 2px 3px 8px rgba(255, 105, 180, 0.6);
      }

      .hero-desc {
        font-size: 0.95rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.95);
        background: rgba(0, 0, 0, 0.25);
        padding: 18px 22px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: justify;
      }

      /* Cute Explore Button */
      .btn-exp {
        font-weight: 600;
        font-size: 1rem;
        background: linear-gradient(135deg, #ffffff, #ffe4ec);
        color: var(--primary-600);
        border: 2px solid var(--primary-300);
        border-radius: 16px !important;
        box-shadow: 0 8px 20px rgba(255, 105, 180, 0.35);
        padding: 12px 32px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .btn-exp:hover,
      .btn-exp:active {
        background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
        color: #ffffff;
        border-color: var(--primary-500);
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 12px 25px rgba(255, 105, 180, 0.5);
      }

      /* Floating Audio Toggle */
      .audio-btn {
        z-index: 20;
        width: 48px;
        height: 48px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        border: 2px solid var(--primary-300);
        color: var(--primary-700);
        box-shadow: 0 6px 18px rgba(255, 105, 180, 0.3);
        transition: all 0.3s ease;
      }
      .audio-btn:hover {
        background: var(--primary-500);
        color: #ffffff;
        transform: scale(1.08);
      }

      @media (max-width: 576px) {
        .hero-card {
          padding: 18px;
          border-radius: 20px;
          max-height: 80vh;
          overflow-y: auto;
        }
        .hero-name {
          font-size: 2rem;
        }
        .hero-fullname {
          font-size: 1.1rem;
        }
        .hero-desc {
          font-size: 0.82rem;
          padding: 12px 14px;
        }
      }
    </style>

    <div class="w-100 position-relative" style="min-height: 100vh; height: 100dvh; overflow: hidden;">
      
      <!-- BACKGROUND VIDEO -->
      <div class="position-absolute top-0 start-0 w-100 h-100 overflow-hidden">
        <video
          class="vid w-100 h-100"
          src="assets/we-meet.mp4"
          autoplay
          loop
          muted
          playsinline
        ></video>
      </div>

      <!-- MUTE / UNMUTE TOGGLE BUTTON -->
      <button
        id="audioToggleBtn"
        class="position-absolute top-0 end-0 m-3 m-md-4 btn audio-btn rounded-circle d-flex align-items-center justify-content-center"
        aria-label="Toggle Audio"
      >
        <i id="audioIcon" class="fa-solid fa-volume-xmark fs-5"></i>
      </button>

      <!-- HERO CONTENT AT BOTTOM LEFT CORNER -->
      <div class="position-absolute bottom-0 start-0 w-100 p-4 p-md-5 d-flex align-items-end justify-content-start" style="z-index: 10;">
        <div class="hero-card">
          <div class="text-start">
            <h1 class="fw-bold font-chewy hero-name mb-0">Hello, Mila ✨</h1>
          </div>
          <div class="text-start mt-1">
            <h4 class="font-chewy hero-fullname mb-0">
              Amyllah Fadhllynah Binti Nur Amin
            </h4>
          </div>
          <div class="hero-desc mt-3">
            Dua negara, dua kota, dan satu kenangan saat kita sempat bertemu. Sekarang, kamu tetap berada di jauh sana dan aku tetap di sini bersama sepi, sebagai orang asing yang pernah saling sayang.
          </div>
          <div class="mt-4 text-start">
            <a
              class="btn-exp text-decoration-none"
              href="pages/second.html"
            >
              Explore more <i class="fa-solid fa-sparkles"></i>
            </a>
          </div>
        </div>
      </div>

    </div>

    <!-- BOOTSTRAP -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcXn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- MUTE / UNMUTE SCRIPT -->
    <script>
      const bgVideo = document.querySelector('.vid');
      const audioToggleBtn = document.getElementById('audioToggleBtn');
      const audioIcon = document.getElementById('audioIcon');

      // Default muted
      bgVideo.muted = true;

      audioToggleBtn.addEventListener('click', () => {
        bgVideo.muted = !bgVideo.muted;
        
        if (bgVideo.muted) {
          audioIcon.classList.remove('fa-volume-high');
          audioIcon.classList.add('fa-volume-xmark');
        } else {
          audioIcon.classList.remove('fa-volume-xmark');
          audioIcon.classList.add('fa-volume-high');
          bgVideo.play().catch(e => console.log(e));
        }
      });
    </script>
  </body>
</html>
